blueprint:
  name: GeekMagic Live Display
  description: >-
    Vis en overskrift og en til fire værdier på GeekMagic SmallTV-displayet.
    Skærmen deles i lige store linjer, og bogstaverne skaleres så teksten
    fylder displayet. Kan bruges både til konstant overvågning og til et
    enkelt billede fra en automation.
  domain: script
  input:
    title:
      name: Titel
      description: Overskriften på den øverste linje. Kan være tom.
      default: ""
      selector:
        text:
    line_count:
      name: Antal linier
      description: >-
        Hvor mange linier displayet skal vise, 1 til 5. Titlen tælles med,
        så der skal være en enhed valgt for hver linje under titlen.
      default: "3"
      selector:
        select:
          custom_value: false
          options:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
    data_1:
      name: Linje 2
      description: Værdien på den anden linje.
      default: []
      selector:
        entity:
    data_2:
      name: Linje 3
      description: Værdien på den tredje linje.
      default: []
      selector:
        entity:
    data_3:
      name: Linje 4
      description: Værdien på den fjerde linje.
      default: []
      selector:
        entity:
    data_4:
      name: Linje 5
      description: Værdien på den femte linje.
      default: []
      selector:
        entity:
    keep_watching:
      name: Opdater automatisk
      description: >-
        Ja: displayet følger værdierne og opdaterer sig, når de ændrer sig.
        Nej: kun ét billede, hver gang scriptet køres.
      default: true
      selector:
        boolean:
    foreground_color:
      name: Tekstfarve
      default: "#ffffff"
      selector:
        text:
    background_color:
      name: Baggrundsfarve
      default: "#16324f"
      selector:
        text:

mode: single

# Inputs skal hentes med !input. Et variables-step i sequence kan ikke se
# input-navnene, så de lægges ind her og bruges videre nedenfor.
variables:
  heading: !input title
  line_total: !input line_count
  pick_1: !input data_1
  pick_2: !input data_2
  pick_3: !input data_3
  pick_4: !input data_4
  watch: !input keep_watching
  text_color: !input foreground_color
  back_color: !input background_color
  # Spring tomme felter over, så rækkefølgen på valgene er ligegyldig.
  filled_data: >-
    {{ [pick_1, pick_2, pick_3, pick_4] | reject('eq', []) | reject('eq', none) | list }}
  # Listeadskæring bruges frem for slice-filteret, fordi slice() i
  # Home Assistants Jinja fejler med division by zero ved nul.
  chosen_data: >-
    {{ filled_data[:[line_total | int - 1, 0] | max] }}

sequence:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ chosen_data | count > 0 }}"
        sequence:
          # entity_id er et felt i tjenestens egen skema, ikke et target,
          # derfor skal det sendes i data.
          - action: >-
              {{ 'geekmagic_live_display.watch_entities'
                 if watch
                 else 'geekmagic_live_display.show_entities' }}
            data:
              title: "{{ heading | trim }}"
              entity_id: "{{ chosen_data }}"
              foreground_color: "{{ text_color }}"
              background_color: "{{ back_color }}"
    # Uden valgte enheder, for eksempel linjetal 1, vises klokkeslættet.
    default:
      - action: geekmagic_live_display.show
        data:
          title: "{{ heading | trim }}"
          message: "{{ now().strftime('%H:%M') }}"
          foreground_color: "{{ text_color }}"
          background_color: "{{ back_color }}"
